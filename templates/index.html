<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Student Success Prediction</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
        }

        /* HEADER */

        .header {
            background: #1e3a8a;
            color: white;
            padding: 25px 40px;
        }

        .header h1 {
            font-size: 30px;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 15px;
            opacity: 0.9;
        }

        /* MAIN CONTAINER */

        .container {
            max-width: 1200px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .section-title {
            font-size: 20px;
            color: #1e3a8a;
            margin-bottom: 25px;
            border-bottom: 2px solid #e5e7eb;
            padding-bottom: 10px;
        }

        /* FORM */

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 22px 30px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: 600;
            margin-bottom: 7px;
            font-size: 14px;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font-size: 14px;
            background: white;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.15);
        }

        /* INVALID INPUT */

        .error {
            color: #dc2626;
            font-size: 13px;
            margin-top: 5px;
            font-weight: 600;
            min-height: 18px;
        }

        .invalid {
            border: 2px solid #dc2626 !important;
            background-color: #fff5f5;
        }

        /* BUTTONS */

        .button-section {
            margin-top: 30px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .predict-btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 13px 28px;
            border-radius: 7px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        .predict-btn:hover {
            background: #1d4ed8;
        }

        .history-btn,
        .dashboard-btn {
            color: white;
            text-decoration: none;
            padding: 13px 28px;
            border-radius: 7px;
            font-size: 15px;
            font-weight: 600;
        }

        .history-btn {
            background: #374151;
        }

        .dashboard-btn {
            background: #059669;
        }

        .history-btn:hover {
            background: #1f2937;
        }

        .dashboard-btn:hover {
            background: #047857;
        }

        /* FOOTER */

        .footer {
            text-align: center;
            margin-top: 30px;
            padding: 20px;
            color: #6b7280;
            font-size: 13px;
        }

        /* MOBILE */

        @media (max-width: 700px) {

            .form-grid {
                grid-template-columns: 1fr;
            }

            .header {
                padding: 20px;
            }

            .header h1 {
                font-size: 24px;
            }

            .card {
                padding: 20px;
            }

        }

    </style>

</head>


<body>

    <!-- HEADER -->

    <div class="header">

        <h1>AI Student Success Prediction</h1>

        <p>
            Machine Learning Based Student Performance Prediction
            & Recommendation System
        </p>

    </div>


    <!-- MAIN CONTENT -->

    <div class="container">

        <div class="card">

            <h2 class="section-title">
                Student Information
            </h2>


            <form action="/predict" method="POST">


                <div class="form-grid">


                    <!-- 1. HOURS STUDIED -->

                    <div class="form-group">

                        <label>Hours Studied</label>

                        <input
                            type="number"
                            name="Hours_Studied"
                            min="1"
                            max="44"
                            step="1"
                            required
                        >

                        <small
                            class="error"
                            id="Hours_Studied_error">
                        </small>

                    </div>


                    <!-- 2. ATTENDANCE -->

                    <div class="form-group">

                        <label>Attendance (%)</label>

                        <input
                            type="number"
                            name="Attendance"
                            min="60"
                            max="100"
                            step="1"
                            required
                        >

                        <small
                            class="error"
                            id="Attendance_error">
                        </small>

                    </div>


                    <!-- 3. PARENTAL INVOLVEMENT -->

                    <div class="form-group">

                        <label>Parental Involvement</label>

                        <select name="Parental_Involvement" required>

                            <option value="">Select</option>
                            <option value="Low">Low</option>
                            <option value="Medium">Medium</option>
                            <option value="High">High</option>

                        </select>

                        <small
                            class="error"
                            id="Parental_Involvement_error">
                        </small>

                    </div>


                    <!-- 4. ACCESS TO RESOURCES -->

                    <div class="form-group">

                        <label>Access to Resources</label>

                        <select name="Access_to_Resources" required>

                            <option value="">Select</option>
                            <option value="Low">Low</option>
                            <option value="Medium">Medium</option>
                            <option value="High">High</option>

                        </select>

                        <small
                            class="error"
                            id="Access_to_Resources_error">
                        </small>

                    </div>


                    <!-- 5. EXTRACURRICULAR -->

                    <div class="form-group">

                        <label>Extracurricular Activities</label>

                        <select
                            name="Extracurricular_Activities"
                            required>

                            <option value="">Select</option>
                            <option value="Yes">Yes</option>
                            <option value="No">No</option>

                        </select>

                        <small
                            class="error"
                            id="Extracurricular_Activities_error">
                        </small>

                    </div>


                    <!-- 6. SLEEP HOURS -->

                    <div class="form-group">

                        <label>Sleep Hours</label>

                        <input
                            type="number"
                            name="Sleep_Hours"
                            min="4"
                            max="10"
                            step="1"
                            required
                        >

                        <small
                            class="error"
                            id="Sleep_Hours_error">
                        </small>

                    </div>


                    <!-- 7. PREVIOUS SCORES -->

                    <div class="form-group">

                        <label>Previous Scores</label>

                        <input
                            type="number"
                            name="Previous_Scores"
                            min="50"
                            max="100"
                            step="1"
                            required
                        >

                        <small
                            class="error"
                            id="Previous_Scores_error">
                        </small>

                    </div>


                    <!-- 8. MOTIVATION -->

                    <div class="form-group">

                        <label>Motivation Level</label>

                        <select name="Motivation_Level" required>

                            <option value="">Select</option>
                            <option value="Low">Low</option>
                            <option value="Medium">Medium</option>
                            <option value="High">High</option>

                        </select>

                        <small
                            class="error"
                            id="Motivation_Level_error">
                        </small>

                    </div>


                    <!-- 9. INTERNET ACCESS -->

                    <div class="form-group">

                        <label>Internet Access</label>

                        <select name="Internet_Access" required>

                            <option value="">Select</option>
                            <option value="Yes">Yes</option>
                            <option value="No">No</option>

                        </select>

                        <small
                            class="error"
                            id="Internet_Access_error">
                        </small>

                    </div>


                    <!-- 10. TUTORING -->

                    <div class="form-group">

                        <label>Tutoring Sessions</label>

                        <input
                            type="number"
                            name="Tutoring_Sessions"
                            min="0"
                            max="8"
                            step="1"
                            required
                        >

                        <small
                            class="error"
                            id="Tutoring_Sessions_error">
                        </small>

                    </div>


                    <!-- 11. FAMILY INCOME -->

                    <div class="form-group">

                        <label>Family Income</label>

                        <select name="Family_Income" required>

                            <option value="">Select</option>
                            <option value="Low">Low</option>
                            <option value="Medium">Medium</option>
                            <option value="High">High</option>

                        </select>

                        <small
                            class="error"
                            id="Family_Income_error">
                        </small>

                    </div>


                    <!-- 12. TEACHER QUALITY -->

                    <div class="form-group">

                        <label>Teacher Quality</label>

                        <select name="Teacher_Quality" required>

                            <option value="">Select</option>
                            <option value="Low">Low</option>
                            <option value="Medium">Medium</option>
                            <option value="High">High</option>

                        </select>

                        <small
                            class="error"
                            id="Teacher_Quality_error">
                        </small>

                    </div>


                    <!-- 13. SCHOOL TYPE -->

                    <div class="form-group">

                        <label>School Type</label>

                        <select name="School_Type" required>

                            <option value="">Select</option>
                            <option value="Public">Public</option>
                            <option value="Private">Private</option>

                        </select>

                        <small
                            class="error"
                            id="School_Type_error">
                        </small>

                    </div>


                    <!-- 14. PEER INFLUENCE -->

                    <div class="form-group">

                        <label>Peer Influence</label>

                        <select name="Peer_Influence" required>

                            <option value="">Select</option>
                            <option value="Positive">Positive</option>
                            <option value="Neutral">Neutral</option>
                            <option value="Negative">Negative</option>

                        </select>

                        <small
                            class="error"
                            id="Peer_Influence_error">
                        </small>

                    </div>


                    <!-- 15. PHYSICAL ACTIVITY -->

                    <div class="form-group">

                        <label>Physical Activity</label>

                        <input
                            type="number"
                            name="Physical_Activity"
                            min="0"
                            max="6"
                            step="1"
                            required
                        >

                        <small
                            class="error"
                            id="Physical_Activity_error">
                        </small>

                    </div>


                    <!-- 16. LEARNING DISABILITIES -->

                    <div class="form-group">

                        <label>Learning Disabilities</label>

                        <select
                            name="Learning_Disabilities"
                            required>

                            <option value="">Select</option>
                            <option value="No">No</option>
                            <option value="Yes">Yes</option>

                        </select>

                        <small
                            class="error"
                            id="Learning_Disabilities_error">
                        </small>

                    </div>


                    <!-- 17. PARENTAL EDUCATION -->

                    <div class="form-group">

                        <label>Parental Education Level</label>

                        <select
                            name="Parental_Education_Level"
                            required>

                            <option value="">Select</option>
                            <option value="High School">
                                High School
                            </option>

                            <option value="College">
                                College
                            </option>

                            <option value="Postgraduate">
                                Postgraduate
                            </option>

                        </select>

                        <small
                            class="error"
                            id="Parental_Education_Level_error">
                        </small>

                    </div>


                    <!-- 18. DISTANCE FROM HOME -->

                    <div class="form-group">

                        <label>Distance from Home</label>

                        <select
                            name="Distance_from_Home"
                            required>

                            <option value="">Select</option>
                            <option value="Near">Near</option>
                            <option value="Moderate">Moderate</option>
                            <option value="Far">Far</option>

                        </select>

                        <small
                            class="error"
                            id="Distance_from_Home_error">
                        </small>

                    </div>


                    <!-- 19. GENDER -->

                    <div class="form-group">

                        <label>Gender</label>

                        <select name="Gender" required>

                            <option value="">Select</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>

                        </select>

                        <small
                            class="error"
                            id="Gender_error">
                        </small>

                    </div>


                </div>


                <!-- BUTTONS -->

                <div class="button-section">

                    <button
                        type="submit"
                        class="predict-btn">

                        Predict Exam Score

                    </button>


                    <a
                        href="/history"
                        class="history-btn">

                        View Prediction History

                    </a>


                    <a
                        href="/dashboard"
                        class="dashboard-btn">

                        Dashboard

                    </a>

                </div>


            </form>

        </div>


        <!-- FOOTER -->

        <div class="footer">

            AI-Powered Student Success Prediction &
            Recommendation System

        </div>

    </div>


    <!-- VALIDATION SCRIPT -->

    <script>

        const form = document.querySelector("form");


        /*
         * Numeric validation rules
         */

        const numericRules = {

            Hours_Studied: {
                min: 1,
                max: 44,
                message:
                    "Invalid Hours Studied. Enter a value between 1 and 44."
            },

            Attendance: {
                min: 60,
                max: 100,
                message:
                    "Invalid Attendance. Enter a value between 60 and 100."
            },

            Sleep_Hours: {
                min: 4,
                max: 10,
                message:
                    "Invalid Sleep Hours. Enter a value between 4 and 10."
            },

            Previous_Scores: {
                min: 50,
                max: 100,
                message:
                    "Invalid Previous Scores. Enter a value between 50 and 100."
            },

            Tutoring_Sessions: {
                min: 0,
                max: 8,
                message:
                    "Invalid Tutoring Sessions. Enter a value between 0 and 8."
            },

            Physical_Activity: {
                min: 0,
                max: 6,
                message:
                    "Invalid Physical Activity. Enter a value between 0 and 6."
            }

        };


        /*
         * Allowed dropdown values
         */

        const selectRules = {

            Parental_Involvement:
                ["Low", "Medium", "High"],

            Access_to_Resources:
                ["Low", "Medium", "High"],

            Extracurricular_Activities:
                ["Yes", "No"],

            Motivation_Level:
                ["Low", "Medium", "High"],

            Internet_Access:
                ["Yes", "No"],

            Family_Income:
                ["Low", "Medium", "High"],

            Teacher_Quality:
                ["Low", "Medium", "High"],

            School_Type:
                ["Public", "Private"],

            Peer_Influence:
                ["Positive", "Neutral", "Negative"],

            Learning_Disabilities:
                ["No", "Yes"],

            Parental_Education_Level:
                ["High School", "College", "Postgraduate"],

            Distance_from_Home:
                ["Near", "Moderate", "Far"],

            Gender:
                ["Male", "Female"]

        };


        /*
         * Clear error
         */

        function clearError(input, error) {

            input.classList.remove("invalid");

            error.textContent = "";

        }


        /*
         * Show error
         */

        function showError(input, error, message) {

            input.classList.add("invalid");

            error.textContent = message;

        }


        /*
         * Form validation
         */

        form.addEventListener("submit", function(event) {

            let valid = true;


            /*
             * Validate numeric inputs
             */

            for (let field in numericRules) {

                const input =
                    document.querySelector(
                        `[name="${field}"]`
                    );

                const error =
                    document.getElementById(
                        field + "_error"
                    );

                clearError(input, error);


                const value = Number(input.value);


                if (
                    input.value === "" ||
                    !Number.isFinite(value) ||
                    value < numericRules[field].min ||
                    value > numericRules[field].max
                ) {

                    showError(
                        input,
                        error,
                        numericRules[field].message
                    );

                    valid = false;

                }

            }


            /*
             * Validate dropdown inputs
             */

            for (let field in selectRules) {

                const input =
                    document.querySelector(
                        `[name="${field}"]`
                    );

                const error =
                    document.getElementById(
                        field + "_error"
                    );

                clearError(input, error);


                const value = input.value;


                if (
                    value === "" ||
                    !selectRules[field].includes(value)
                ) {

                    showError(
                        input,
                        error,
                        "Invalid " +
                        field.replaceAll("_", " ") +
                        ". Please select a valid option."
                    );

                    valid = false;

                }

            }


            /*
             * Stop form submission if invalid
             */

            if (!valid) {

                event.preventDefault();

                window.scrollTo({
                    top: 0,
                    behavior: "smooth"
                });

            }

        });


        /*
         * Remove error when user changes value
         */

        form.querySelectorAll("input, select").forEach(
            function(input) {

                input.addEventListener(
                    "input",
                    function() {

                        input.classList.remove("invalid");

                        const error =
                            document.getElementById(
                                input.name + "_error"
                            );

                        if (error) {
                            error.textContent = "";
                        }

                    }
                );


                input.addEventListener(
                    "change",
                    function() {

                        input.classList.remove("invalid");

                        const error =
                            document.getElementById(
                                input.name + "_error"
                            );

                        if (error) {
                            error.textContent = "";
                        }

                    }
                );

            }
        );

    </script>


</body>

</html>
